name: Sync data

on:
  schedule:
    # Every 6 hours. GitHub Actions has open egress, which is where ingestion belongs.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      knesset:
        description: "Knesset numbers to pull, comma separated"
        default: "24,25"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reported before ingestion and carried into the PR body, so the six-hourly run
      # says in plain words whether the official 26th-Knesset lists have appeared yet.
      # Nobody should have to check the portal by hand.
      - name: Probe data.gov.il coverage
        id: probe
        run: |
          {
            echo "report<<PROBE_EOF"
            npm run --silent probe 2>&1 || echo "probe failed — see the job log"
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pull upstream sources
        run: npm run ingest -- --live --knesset=${{ inputs.knesset || '24,25' }}

      - name: Validate
        run: npm run validate

      # A pull request rather than a direct push: on an elections site every data change
      # deserves a human look before it reaches the public build, and the snapshot diff is
      # exactly the review surface for that.
      - name: Open a data pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/sync
          base: main
          commit-message: "data: scheduled sync"
          title: "data: scheduled sync"
          body: |
            Automated sync of the committed snapshot.

            Review the diff under `data/snapshots/` before merging — it is the data the
            public site will serve. Check `data/unmatched.json` for candidates that could
            not be linked to a Knesset record; those are resolved by adding entries to
            `data/manual_overrides/person_links.json`, never by loosening the matcher.

            ### data.gov.il coverage

            ```
            ${{ steps.probe.outputs.report }}
            ```

            If the probe reports that the 26th Knesset **is** covered, this sync has already
            ingested the official lists and they now outrank the manual layer. Read the
            snapshot diff, then flip `dataset` to `"real"` in
            `data/manual_overrides/election.json` to drop the example banner and open
            indexing. That flip stays a human decision on purpose.
          add-paths: |
            data/snapshots
            data/fixtures
            data/unmatched.json
          delete-branch: true
