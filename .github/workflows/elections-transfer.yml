name: Temporary Elections transfer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bundle and push exact commit to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3b2d018ca23d37dace180fa2976d06957fb57f60
          bundle="$(mktemp /tmp/elections-XXXXXX.bundle)"
          trap 'rm -f "$bundle"' EXIT
          curl --fail --location --silent --show-error --retry 2 --output "$bundle" 'https://drive.google.com/uc?export=download&id=1qGfbWv1DYEkfQVJJFgs-VJjLhdWl-zLB'
          printf '%s  %s\n' '35f1358401440f2a34c7dbbad6f24315eddcdf588d647fba0624f7a224722c42' "$bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" a5d8c6ab9ca93c9ccfcf3f8600e460bb1ded7835
          test "$(git rev-parse FETCH_HEAD)" = a5d8c6ab9ca93c9ccfcf3f8600e460bb1ded7835
          test "$(git rev-parse FETCH_HEAD^)" = 3b2d018ca23d37dace180fa2976d06957fb57f60
          test -z "$(git ls-remote origin refs/heads/instinct/official-lists-20260927)"
          git push origin a5d8c6ab9ca93c9ccfcf3f8600e460bb1ded7835:refs/heads/instinct/official-lists-20260927
