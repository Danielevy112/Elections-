name: Temporary Elections voter update transfer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bundle and push exact commit to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c3a0ea82b52af782c6dd95ed352ed6919af14736
          bundle="$(mktemp /tmp/elections-XXXXXX.bundle)"
          trap 'rm -f "$bundle"' EXIT
          curl --fail --location --silent --show-error --retry 2 --output "$bundle" 'https://drive.google.com/uc?export=download&id=1dQ_xR1lvrH1Nu167iOaZOShdOKo-D0ff'
          printf '%s  %s\n' '30386128d67c0467e8ac08a5633d051eb091e347e139d9a300dcf255fa4388ad' "$bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" 6797596e3ed75a23e1f50943a31d426e222e7f28
          test "$(git rev-parse FETCH_HEAD)" = 6797596e3ed75a23e1f50943a31d426e222e7f28
          test "$(git rev-parse FETCH_HEAD^)" = c3a0ea82b52af782c6dd95ed352ed6919af14736
          test -z "$(git ls-remote origin refs/heads/instinct/voter-quick-wins)"
          git push origin 6797596e3ed75a23e1f50943a31d426e222e7f28:refs/heads/instinct/voter-quick-wins
