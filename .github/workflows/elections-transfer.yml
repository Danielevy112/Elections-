name: Temporary Elections poll-bloc transfer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify one-time bundle and push reviewed commit to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 79020b5d749b0ecf731ba797febaf19f7233654f
          bundle="$(mktemp /tmp/elections-XXXXXX.bundle)"
          trap 'rm -f "$bundle"' EXIT
          curl --fail --location --silent --show-error --retry 2 --output "$bundle" 'https://drive.google.com/uc?export=download&id=15huWG3C_CRF7Y48fB-NH1bw4695nRFWr'
          printf '%s  %s\n' '693458424c49e6646a3a63080f14116f9bead84f274ae6003f69408a03280278' "$bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" 51868589fee3bd5c60e3922d0606ec97f6add0cf
          test "$(git rev-parse FETCH_HEAD)" = 51868589fee3bd5c60e3922d0606ec97f6add0cf
          test "$(git rev-parse FETCH_HEAD^)" = 79020b5d749b0ecf731ba797febaf19f7233654f
          test -z "$(git ls-remote origin refs/heads/instinct/per-poll-blocs)"
          git push origin 51868589fee3bd5c60e3922d0606ec97f6add0cf:refs/heads/instinct/per-poll-blocs
