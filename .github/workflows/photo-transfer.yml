name: Temporary photo transfer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and push exact photo commit
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(mktemp /tmp/elections-photos-XXXXXX.bundle)"
          trap 'rm -f "$bundle"' EXIT
          curl --fail --location --silent --show-error --retry 2 --output "$bundle" 'https://drive.google.com/uc?export=download&id=1ua7GepR9P1-pFcZ7RJP_WoG05WLaUcns'
          printf '%s  %s\n' '6eaafc07a2cc7d90dffc85cfc2815d4f5e910075baf32122ff9d6c8e177b9256' "$bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/instinct/frontlist-photos
          test "$(git rev-parse FETCH_HEAD)" = ba4667f2accba67b7817c9aaa80bcb9bb62e8e46
          test "$(git rev-parse FETCH_HEAD^)" = 17abf45c6706601eca2ea11ec0369763a6edbb71
          test "$(git ls-remote origin refs/heads/instinct/frontlist-photos | cut -f1)" = 17abf45c6706601eca2ea11ec0369763a6edbb71
          git push origin ba4667f2accba67b7817c9aaa80bcb9bb62e8e46:refs/heads/instinct/frontlist-photos
